name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf python3-dev

      - name: Install frontend deps
        run: npm install

      # ── Sidecars: fetch the API sources and build platform binaries ──
      - name: Fetch API sources
        run: |
          git clone --depth 1 https://github.com/aryaniiil/kuhi-anime-api api/anime-api
          git clone --depth 1 https://github.com/walterwhite-69/Anivexa-API api/anivexa

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install pyinstaller
          python -m pip install -r api/anime-api/requirements.txt
          python -m pip install -r proxy/requirements.txt

      - name: Build sidecars
        run: npm run build:sidecars

      # ── App ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KitaWatch ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false