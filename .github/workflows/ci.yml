name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf python3-dev

      - name: Install frontend deps
        run: npm install

      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install pyinstaller
          python -m pip install -r api/anime-api/requirements.txt
          python -m pip install -r proxy/requirements.txt

      - name: Build sidecars
        run: npm run build:sidecars

      - name: Check Rust app compiles
        run: cargo check
        working-directory: src-tauri